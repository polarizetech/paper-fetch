# The search half of the Neuroscience discipline. Evidence rules (study designs, grading,
# critique) belong to the application that reads the papers, not here.
slug = "neuroscience"
label = "Neuroscience"
scope = "Nervous system structure and function from ion channels to behaviour: circuits, oscillations, plasticity, neuroimaging and computational models."
search_guidance = """
Write queries suited to PubMed and OpenAlex. Name the structure, the signal and the preparation separately (hippocampus, theta rhythm, freely moving rats) rather than asking the question in prose. Expand abbreviations alongside themselves — LTP, LFP and DREADD are each ambiguous on their own — and include one older or alternative term for the structure, since the anatomical nomenclature has changed more than once.
"""
examples = ["Does repetitive transcranial magnetic stimulation of motor cortex change motor-evoked potential amplitude?", "Is long-term potentiation necessary for spatial memory formation?", "Do place cells remap when the environment changes shape?"]

