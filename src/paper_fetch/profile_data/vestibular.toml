# The search half of the Vestibular science discipline. Evidence rules (study designs, grading,
# critique) belong to the application that reads the papers, not here.
slug = "vestibular"
label = "Vestibular science"
scope = "Balance, the vestibular end organs and their central pathways, oculomotor and postural responses, and the disorders of dizziness and vertigo."
search_guidance = """
Write queries suited to PubMed/MEDLINE, Europe PMC and OpenAlex. Name the test rather than the symptom: vHIT, caloric irrigation, VEMP, posturography and subjective visual vertical each have their own literature, and a query for 'dizziness' returns almost none of it. Use the consensus diagnostic label (BPPV, vestibular migraine, PPPD) where one exists, and its expansion alongside the abbreviation.
"""
examples = ["Does video head impulse test gain distinguish vestibular neuritis from stroke?", "Does vestibular stimulation alter blood pressure through the vestibulo-sympathetic reflex?", "Does vestibular rehabilitation reduce dizziness handicap in chronic unilateral vestibular loss?"]

[[anchors]]
system = "mesh"
label = "Vestibular Diseases"
id = "D015837"
tree = "C09.218.568.900"
synonyms = ["vestibular disorder", "vestibulopathy", "dizziness", "vertigo"]

[[anchors]]
system = "mesh"
label = "Vestibule, Labyrinth"
id = "D014722"
tree = "A09.246.300.909"
synonyms = ["vestibular apparatus", "otolith organs", "utricle", "saccule", "semicircular canals"]

[[anchors]]
system = "free-text"
label = "vestibulo-ocular reflex"
synonyms = ["VOR", "VOR gain", "video head impulse test", "vHIT", "caloric testing"]

[[anchors]]
system = "free-text"
label = "vestibular evoked myogenic potential"
synonyms = ["VEMP", "cVEMP", "oVEMP"]

[[anchors]]
system = "free-text"
label = "vestibulo-sympathetic reflex"
synonyms = ["vestibulo-autonomic", "vestibular autonomic interaction", "orthostatic vestibular response"]

[[anchors]]
system = "free-text"
label = "persistent postural-perceptual dizziness"
synonyms = ["PPPD", "vestibular migraine", "benign paroxysmal positional vertigo", "BPPV", "Meniere disease"]

[[measures]]
label = "Angles, tilts and angular velocity"
units = ["deg", "degrees", "deg/s", "°/s"]

[[measures]]
label = "Reflex gain"
units = ["gain"]

[[measures]]
label = "Sound and stimulus levels"
units = ["dB", "dB nHL", "dB SPL"]

[[measures]]
label = "Asymmetries and proportions"
units = ["%", "percent"]

[[measures]]
label = "Response latency"
units = ["ms", "msec"]

[[sources]]
key = "pubmed"
label = "PubMed / MEDLINE"
role = "literature"
url = "https://pubmed.ncbi.nlm.nih.gov/"
why = "MeSH-indexed; the C09 otorhinolaryngologic tree."

[[sources]]
key = "europepmc"
label = "Europe PMC"
role = "literature"
url = "https://www.ebi.ac.uk/europepmc/webservices/rest/"
why = "Open-access full text plus MeSH terms in one record."

[[sources]]
key = "openalex"
label = "OpenAlex"
role = "literature"
url = "https://api.openalex.org/works"
why = "Venue and open-access metadata, and the citation graph."

[[sources]]
key = "barany"
label = "Barany Society classification documents"
role = "guideline"
url = "https://www.jvr-web.org"
why = "This field's consensus diagnostic criteria (BPPV, vestibular migraine, PPPD, Meniere disease) are published as papers in the Journal of Vestibular Research, the society's venue since 2015. The society has no dedicated API or stable domain of its own that resolved from this environment; the documents are reached through PubMed/Europe PMC like any other paper, and jvr-web.org is recorded here as the journal of record rather than as a scrape target."
